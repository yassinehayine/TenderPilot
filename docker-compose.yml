services:
  postgres:
    image: postgres:16-alpine
    container_name: tenderpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tenderpilot
      POSTGRES_PASSWORD: tenderpilot
      POSTGRES_DB: tenderpilot
    ports:
      - "5432:5432"
    volumes:
      - tenderpilot-postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: tenderpilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - tenderpilot-redis-data:/data
volumes:
  tenderpilot-postgres-data:
  tenderpilot-redis-data: